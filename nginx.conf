server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds directory-style routes, so /about resolves to
    # /about/index.html. Without the $uri/ step nginx would 404 on /about.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Everything under /_astro/ carries a content hash in its filename, so a
    # given URL can never change contents.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The fonts Astro self-hosts are hashed the same way.
    location ~* \.(woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
